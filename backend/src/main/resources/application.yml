server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/uploads.db}?busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 30000

app:
  staging-dir: ${STAGING_DIR:./data/staging}
  completed-dir: ${COMPLETED_DIR:./data/completed}

logging:
  level:
    com.hugefiletransfer: INFO
